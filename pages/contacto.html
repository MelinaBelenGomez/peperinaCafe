    <meta name="author" content="Melina Gomez">

    <link rel="shortcut icon" href="../images/icon.png" type="image/x-icon">

    <!-- Fuente de Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Otra fuente de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Guides&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <header class="indexHeader">

        <nav>
            <ul class="linksInicio">
                <li><a class="linksInicioStyle" href="../index.html">Inicio</a></li>
                <li><a class="linksInicioStyle" href="./menu.html">Menú</a></li>
                <li><a class="linksInicioStyle" href="./locales.html">Locales</a></li>
                <li><a class="linksInicioStyle" href="./nosotros.html">Nosotros</a></li>
                <li><a class="linksInicioStyle" href="./contacto.html">Contacto</a></li>
            </ul>
        </nav>

        <section class="indexHome">
            <h1 class="indexPeperina">PEPERINA</h1>
            <p class="indexHomeP">CAFETERÍA DE ESPECIALIDAD</p>
        </section>

    </header>

    <main>

        <section class="contenedorContacto">

            <h1 class="tituloContacto">CONTACTO</h1>

            <p class="pContacto">
                ¿Tenés alguna consulta? ¡Escribinos!
            </p>

            <form class="formularioContacto">

                <input type="text" placeholder="Nombre" class="inputContacto" required>

                <input type="email" placeholder="Correo electrónico" class="inputContacto" required>

                <textarea placeholder="Mensaje" class="textareaContacto" required></textarea>

                <button type="submit" class="btnEnviar">
                    Enviar
                </button>

            </form>

        </section>

    </main>

    <footer>

        <section class="footerInicio">

            <div class="logoFooter">
                <img src="../images/iconoTazaFooter.png" alt="iconoTazaFooter" class="iconoTazaFooter">

                <h3 class="tituloFooter">PEPERINA</h3>
            </div>

            <nav class="redesFooter">
                <a href="#">
                    <img src="../images/facebookIcon.png" alt="iconoFacebook" class="iconoRedes">
                </a>

                <a href="#">
                    <img src="../images/instagramIcon.png" alt="iconoInstagram" class="iconoRedes">
                </a>

                <a href="#">
                    <img src="../images/twitterIcon.png" alt="iconoTwitter" class="iconoRedes">
                </a>
            </nav>

        </section>

        <p class="copyright">
            © 2026 Peperina. Todos los derechos reservados.
        </p>

    </footer>
